# Netlify-konfiguration för Gruvan Tech Dashboard.
#
# Schemalagda funktioner registreras här (module-agnostiskt och pålitligt,
# oberoende av CommonJS/ESM). mail-poll körs var 10:e minut och läser inkorgen,
# klassificerar och (om MAIL_AUTODRAFT=true) skapar svarsutkast via Graph.
#
# ⏸ PAUSAD 2026-08-06 på Jimmys begäran (AI-utkasten behöver justeras).
# Två spärrar är lagda, båda tillfälliga:
#   1. MAIL_AUTODRAFT=false i Netlify env → pollaren skulle ändå inte skapa utkast.
#   2. Schemat nedan är bortkommenterat → pollaren körs inte alls.
# SLÅ PÅ IGEN: avkommentera blocket nedan + sätt MAIL_AUTODRAFT=true i Netlify,
# och deploya. On-click-knappen "Analysera & skapa utkast" i dashboarden är
# opåverkad — den skapar fortfarande utkast när du själv klickar.
#
# [functions."mail-poll"]
#   schedule = "*/10 * * * *"

# mail-triage timeout:
# Netlify har INGEN per-funktion timeout-nyckel i netlify.toml för synkrona
# funktioner. Standardtaket är 10 s och kan endast höjas (till max 26 s) på
# konto-/plannivå via Netlify-support/Enterprise — inte via denna fil. Vi kan
# INTE göra mail-triage till en background-funktion (den måste returnera
# klassificering + utkast till UI:t på klick; background ger 202 direkt).
# Därför löses timeouten i kod istället: byte till snabb Claude Haiku 4.5 för
# utkastgenerering + retry/backoff på transienta 429/503. Se lib/triage.js.
