# Netlify-konfiguration för Gruvan Tech Dashboard.
#
# Schemalagda funktioner registreras här (module-agnostiskt och pålitligt,
# oberoende av CommonJS/ESM). mail-poll körs var 10:e minut och läser inkorgen,
# klassificerar och (om MAIL_AUTODRAFT=true) skapar svarsutkast via Graph.
#
# ▶ PÅSLAGEN IGEN 2026-09-29 (pausad 2026-08-06–2026-09-29).
# Schemat är aktivt, men utkast styrs fortfarande separat:
#   * MAIL_AUTODRAFT=false i Netlify env (sedan pausen) → TORRLÄGE: pollern
#     klassificerar och köar i data/mail-queue.json men skapar INGA utkast.
#   * Sätt MAIL_AUTODRAFT=true i Netlify när utkasttonen är godkänd.
# Pollern håller sig inom Netlifys 30 s (se tidsbudgeten i mail-poll.js).
# PAUSA IGEN: kommentera bort blocket nedan och deploya.
# On-click-knappen "Analysera & skapa utkast" påverkas inte av något av detta.
[functions."mail-poll"]
  schedule = "*/10 * * * *"

# Sociala förslag: watchern hämtar nya pressmeddelanden (Svensk Mäklarstatistik
# m.fl.), Claude skriver utkastvarianter och allt köas i data/social-queue.json
# för manuellt godkännande i dashboarden. PUBLICERAR INGENTING — därför är
# schemat aktivt (till skillnad från mail-poll ovan, som pausades för att
# utkasten behövde tonjusteras; här är kön hela designen).
# Källorna släpper månadsvis ~08:00 svensk tid → daglig koll 07:00 UTC
# (09:00 CEST) fångar samma förmiddag.
[functions."social-watch"]
  schedule = "0 7 * * *"

# mail-triage timeout:
# Netlify har INGEN per-funktion timeout-nyckel i netlify.toml för synkrona
# funktioner. Standardtaket är 10 s och kan endast höjas (till max 26 s) på
# konto-/plannivå via Netlify-support/Enterprise — inte via denna fil. Vi kan
# INTE göra mail-triage till en background-funktion (den måste returnera
# klassificering + utkast till UI:t på klick; background ger 202 direkt).
# Därför löses timeouten i kod istället: byte till snabb Claude Haiku 4.5 för
# utkastgenerering + retry/backoff på transienta 429/503. Se lib/triage.js.
